services:
  loreai:
    # Image construite et publiée par la CD GitHub (multi-arch amd64 + arm64), pas de build ici :
    # `docker compose pull && docker compose up -d` suffit sur le Raspberry Pi.
    # LOREAI_TAG permet d'épingler une version précise plutôt que de suivre latest.
    image: ghcr.io/slucky31/loreai-worker:${LOREAI_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOTNET_ENVIRONMENT: Production
    volumes:
      # /data ne porte plus que les logs depuis la bascule PostgreSQL (ADR 0009) : la persistance est
      # sur l'instance mutualisee du Pi, plus dans ce volume. Le conteneur tourne en non-root (uid 1654) ;
      # sur un bind mount c'est la propriete cote hote qui prime.
      #   mkdir -p data && sudo chown -R 1654:1654 data
      - ./data:/data

  loreai-mcp:
    # Lot 3 (#44, ADR 0014) : serveur MCP en lecture seule. Conteneur et image distincts de "loreai" -
    # cycle de vie independant, et surtout un role Postgres different (voir Postgres__ConnectionString
    # ci-dessous). Pas de build ici non plus une fois l'image publiee par la CD.
    image: ghcr.io/slucky31/loreai-mcp:${LOREAI_TAG:-latest}
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
      # Role loreai_ro (GRANT SELECT), deja provisionne (docs/deploiement-raspberry-pi.md, section 3) -
      # jamais le role proprietaire "loreai" utilise par le worker ci-dessus. Valeurs dans .env, pas
      # partagees via env_file : ce conteneur n'a besoin d'aucun des autres secrets de "loreai".
      Postgres__ConnectionString: ${MCP_POSTGRES_CONNECTION_STRING}
      Mcp__BearerToken: ${MCP_BEARER_TOKEN}
    ports:
      # Bind sur l'adresse Tailscale du Pi (D2/ADR 0010) : JAMAIS "5099:8080" seul, qui publierait sur
      # 0.0.0.0, donc potentiellement sur le LAN/la box. MCP_TAILSCALE_BIND_IP = `tailscale ip -4` sur
      # mcm8, voir .env.example.
      - "${MCP_TAILSCALE_BIND_IP}:5099:8080"
    volumes:
      - ./data:/data

# Reseau Docker externe de l'instance PostgreSQL mutualisee (ADR 0009) : LoreAI la rejoint, il ne la
# possede pas - stack Compose distincte, proprietaire de son propre reseau. Pas de depends_on vers un
# service qu'il ne possede pas non plus : le worker demarre et reessaie si Postgres n'est pas encore
# joignable (PostgresSchemaGuard).
networks:
  default:
    name: pi-postgres
    external: true
