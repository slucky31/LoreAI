name: CD

on:
  push:
    branches: [main]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.versionize.outputs.released }}
      version: ${{ steps.versionize.outputs.version }}
    steps:
      # Le GITHUB_TOKEN par défaut ne peut pas pousser sur main : la branch protection
      # exige des status checks qui ne s'exécutent que sur les PR, jamais sur un push direct.
      # RELEASE_TOKEN est un PAT d'un compte admin du repo, exempté via enforce_admins=false.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Versionize
        run: |
          dotnet tool install --global Versionize
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Versionize
        id: versionize
        run: |
          set +e
          versionize --exit-insignificant-commits --skip-changelog --tag-template "v{version}"
          exit_code=$?
          set -e
          if [ $exit_code -eq 0 ]; then
            tag=$(git describe --tags --abbrev=0)
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "No significant commit since the last release, skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push release commit and tag
        if: steps.versionize.outputs.released == 'true'
        run: git push --follow-tags origin main

  build:
    name: Build & Test
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore RaindropAI.slnx

      - name: Build
        run: dotnet build RaindropAI.slnx -c Release --no-restore

      - name: Test
        run: dotnet test RaindropAI.slnx -c Release --no-build -- --coverage --coverage-output-format cobertura

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            "-reports:**/TestResults/*.cobertura.xml" \
            "-targetdir:coverage-report" \
            "-reporttypes:Html;MarkdownSummaryGithub" \
            "-assemblyfilters:-*Tests*"
          cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

  docker:
    name: Publish Docker
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # QEMU n'émule rien pendant le build (le Dockerfile cross-compile), mais buildx en a besoin
      # pour assembler et inspecter les manifestes des plateformes non natives au runner.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata raindropai-worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/raindropai-worker
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}

      - name: Push raindropai-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RaindropAI.Worker/Dockerfile
          push: true
          # arm64 est la cible réelle de déploiement (Raspberry Pi 64-bit) : sans cette ligne
          # l'image publiée est amd64 uniquement et le Pi ne peut pas la démarrer.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-worker.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub Release
    needs: [release, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ needs.release.outputs.version }}" --generate-notes
