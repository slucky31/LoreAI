name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RaindropAI.slnx

      - name: Build
        run: dotnet build RaindropAI.slnx -c Release --no-restore

      - name: Test
        run: dotnet test RaindropAI.slnx -c Release --no-build -- --coverage --coverage-output-format cobertura

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            "-reports:**/TestResults/*.cobertura.xml" \
            "-targetdir:coverage-report" \
            "-reporttypes:Html;MarkdownSummaryGithub" \
            "-assemblyfilters:-*Tests*"
          cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: PR Coverage Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          recreate: true
          path: coverage-report/SummaryGithub.md

  docker:
    name: Docker Build
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build raindropai-worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/RaindropAI.Worker/Dockerfile
          push: false
          # Mêmes plateformes qu'à la publication, pour qu'une régression arm64 échoue sur la PR
          # et non au moment de la release. La cross-compilation garde ce build rapide.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
